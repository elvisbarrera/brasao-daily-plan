<style>
/* Concept: an iOS-style daily coach. Warm paper grounds, one deep-gold tint, large serif titles, grouped inset lists, bottom tab bar. */
:root{
  --bg:#f0eee9; --surface:#fffefb; --surface2:#f6f3ec; --fg:#1d1710; --fg2:#675f53; --fg3:#968d7e;
  --line:#e3ddd0; --accent:#8a6726; --accent-soft:#f3e9d2; --on-accent:#fffdf7;
  --ok:#2d7a4d; --ok-soft:#dff0e5; --warn:#a85f0e; --warn-soft:#f8e8cf; --bad:#b0362c; --bad-soft:#f6dcd8;
  --ig:#b8307c; --tt:#1d1710; --fb:#2a6ad1; --go:#2f8a4a; --bar:rgba(240,238,233,.82);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0b07; --surface:#1a150e; --surface2:#231c13; --fg:#f4ede1; --fg2:#bdb3a2; --fg3:#847a69;
  --line:#32281b; --accent:#d6b676; --accent-soft:#3a2f18; --on-accent:#1a1208;
  --ok:#62c18b; --ok-soft:#173424; --warn:#e5a456; --warn-soft:#3a2810; --bad:#f08478; --bad-soft:#3d1a16;
  --ig:#ee6bb0; --tt:#f4ede1; --fb:#6ea3ff; --go:#6dcb86; --bar:rgba(15,11,7,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0b07; --surface:#1a150e; --surface2:#231c13; --fg:#f4ede1; --fg2:#bdb3a2; --fg3:#847a69;
  --line:#32281b; --accent:#d6b676; --accent-soft:#3a2f18; --on-accent:#1a1208;
  --ok:#62c18b; --ok-soft:#173424; --warn:#e5a456; --warn-soft:#3a2810; --bad:#f08478; --bad-soft:#3d1a16;
  --ig:#ee6bb0; --tt:#f4ede1; --fb:#6ea3ff; --go:#6dcb86; --bar:rgba(15,11,7,.82); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.wrap{max-width:660px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--line)}
.bar-in{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.large{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--fg2);font-size:14px;margin-top:3px}
.daynav{display:flex;gap:6px;align-items:center;flex:none}
.circ{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.circ:disabled{opacity:.35;cursor:default}
.pill-btn{height:36px;padding:0 14px;border-radius:18px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{height:32px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}

main{padding-top:14px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);padding:0 4px;display:flex;justify-content:space-between;gap:8px}
.sec>h2 span{letter-spacing:0;text-transform:none;font-weight:500;color:var(--fg3)}
.group{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.group>*+*{border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--fg2);padding:0 6px}

/* summary */
.hero{display:flex;gap:16px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.ring{--p:0;width:66px;height:66px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring i{font-style:normal;width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px}
.hero p{font-size:16px;line-height:1.4}
.hero b{font-weight:700}
.hero small{display:block;color:var(--fg2);font-size:13px;margin-top:4px}

/* tasks */
.task{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.task.done .t-main{opacity:.45}
.task.done .t-title{text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg3);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.t-body{flex:1;min-width:0}
.t-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.time{font-weight:700;font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums}
.t-title{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--fg2);border:1px solid var(--line);white-space:nowrap}
.chip.loc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ig{color:var(--ig)} .chip.tt{color:var(--tt)} .chip.fb{color:var(--fb)} .chip.go{color:var(--go)}
.chip.next{background:var(--accent);color:var(--on-accent);border-color:transparent}
.t-text{margin-top:6px;font-size:15px;color:var(--fg);overflow-wrap:anywhere}
.t-vis{margin-top:4px;font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.t-vis b{color:var(--fg);font-weight:600}
.feed{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)) ,var(--surface)}
.feed .t-title{font-size:17px}
details.more{margin-top:8px}
details.more>summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;gap:4px;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"›";transform:rotate(90deg);display:inline-block;transition:transform .15s}
details.more[open]>summary::after{transform:rotate(-90deg)}
.cap{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cap h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.cap p{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{font-size:13px;font-weight:600;color:var(--accent);padding:4px 10px;border-radius:14px;background:var(--accent-soft);text-transform:none;letter-spacing:0}
.tags{font-size:13px;color:var(--fg2);margin-top:8px;overflow-wrap:anywhere}

/* events */
.ev{padding:12px 14px}
.ev summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.ev summary::-webkit-details-marker{display:none}
.badge{flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:2px;background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.game{background:var(--ok-soft);color:var(--ok)}
.ev .e-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ev .e-body{margin:8px 0 0 0;font-size:14px;color:var(--fg2)}
.ev .e-body b{color:var(--fg)}

/* ads */
.ad{padding:12px 14px}
.ad summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center}
.ad summary::-webkit-details-marker{display:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--fg3)}
.dot.ig{background:var(--ig)} .dot.tt{background:var(--tt)} .dot.fb{background:var(--fb)} .dot.go{background:var(--go)}
.ad .a-name{flex:1;min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.ad .a-amt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.act{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
.act.on{background:var(--ok-soft);color:var(--ok)}
.act.off{background:var(--bad-soft);color:var(--bad)}
.act.run{background:var(--surface2);color:var(--fg2)}
.dl{margin:10px 0 0;display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:14px}
.dl dt{color:var(--fg2)} .dl dd{margin:0;overflow-wrap:anywhere}
.strip{display:grid;grid-template-columns:repeat(31,1fr);gap:2px;margin-top:10px;height:22px;align-items:end}
.strip i{display:block;background:var(--line);border-radius:2px;height:5px}
.strip i.a{background:var(--accent);height:100%}
.strip i.t{outline:2px solid var(--fg);outline-offset:1px}

/* email */
.mail{padding:12px 14px}
.mail blockquote{margin:8px 0 0;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:14px;color:var(--fg2);white-space:pre-wrap;overflow-wrap:anywhere}
.warnline{margin-top:8px;font-size:13px;color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:10px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px}
.cal .dow{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);text-align:center;padding-bottom:4px}
.cell{aspect-ratio:1/1.08;border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;min-width:0}
.cell.empty{background:none}
.cell b{font-size:16px;font-variant-numeric:tabular-nums}
.cell small{font-size:10px;color:var(--fg3);font-variant-numeric:tabular-nums}
.cell.today{outline:2px solid var(--accent)}
.cell.sel{background:var(--accent);color:var(--on-accent)}
.cell.sel small{color:var(--on-accent);opacity:.85}
.cell .st{position:absolute;top:4px;right:6px;font-size:10px;color:var(--accent)}
.cell.sel .st{color:var(--on-accent)}
.drow{display:flex;gap:12px;padding:12px 14px;align-items:center;width:100%;text-align:left}
.drow .d{width:44px;flex:none;text-align:center;line-height:1.1}
.drow .d b{display:block;font-size:20px;font-family:var(--serif)}
.drow .d span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg2)}
.drow .x{flex:1;min-width:0}
.drow .x p{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.drow .x small{color:var(--fg2);font-size:13px}

/* tiles / bars */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile small{display:block;color:var(--fg2);font-size:12px}
.tile b{font-size:22px;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.pbar{padding:12px 14px}
.pbar .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.pbar .row span:last-child{font-variant-numeric:tabular-nums;color:var(--fg2);font-weight:500}
.track{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--fg2)}
.fchips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* guide */
.item{padding:12px 14px}
.item summary{list-style:none;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"›";color:var(--fg3);transform:rotate(90deg);flex:none;transition:transform .15s}
.item[open] summary::after{transform:rotate(-90deg)}
.item p{margin-top:8px;font-size:14px;color:var(--fg2);overflow-wrap:anywhere}
.scroll-x{overflow-x:auto}
table.thr{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
table.thr th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg2);padding:8px 10px;border-bottom:1px solid var(--line)}
table.thr td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.g{color:var(--ok);font-weight:600} td.y{color:var(--warn);font-weight:600} td.r{color:var(--bad);font-weight:600}
.empty-s{padding:18px;text-align:center;color:var(--fg2);font-size:14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--fg3);min-width:0}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:400px){.large{font-size:29px}.seg button{font-size:12px}.dl{grid-template-columns:80px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function chicagoNow(){
  const p = {}; new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  return {y:+p.year,m:+p.month,d:+p.day,min:(+p.hour%24)*60+ +p.minute};
}
const now = chicagoNow();
const inMonth = now.y===2026 && now.m===10;
const TODAY = inMonth ? now.d : (now.y*100+now.m < 202610 ? 1 : 31);
const NOWMIN = inMonth ? now.min : -1;

const mins = t => { const m=String(t).match(/(\d+)(?::(\d+))?\s*([AP]M)/i); if(!m) return 0; let h=+m[1]%12; if(m[3].toUpperCase()==='PM') h+=12; return h*60+(+m[2]||0) };

/* clipboard */
let CLIPS = [];
const clip = txt => { CLIPS.push(txt); return CLIPS.length-1 };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600) }
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast('Copiado'); return }catch(e){}

function chk(id){ return `<button class="chk" data-k="${id}" aria-pressed="${!!done[id]}" aria-label="Marcar como hecho"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg></button>` }

function renderHoy(){
  const d=S.day, day=D[d], tasks=dayTasks(d), ads=visibleAds(d), pr=progress(d);
  const feed=tasks.find(t=>t.kind==='feed'), nStories=tasks.filter(t=>t.kind==='story').length;
  const nOn=ads.filter(a=>a.on).length, nOff=ads.filter(a=>a.off).length;
  const spend=ads.reduce((s,a)=>s+a.amt,0);
  const parts=[];
  if(feed) parts.push(`<b>1 ${feed.x.format.includes('Reel')?'Reel':'post'}</b> (${esc(whereFeed(feed.x.platform).join(' + '))})`);
  if(nStories) parts.push(`<b>${nStories} stories</b>`);
  if(day.email) parts.push(`<b>1 email</b>`);
  if(nOn||nOff) parts.push(`<b>${nOn+nOff} ${nOn+nOff===1?'cambio':'cambios'} en anuncios</b>`);
  const intro = parts.length?`Hoy te toca: ${parts.join(', ').replace(/, ([^,]*)$/,' y $1')}.`:'Hoy no hay tareas para esta selección.';
  const evs = day.events.filter(e=>S.loc==='all'||evTags(e.market).some(tagOK));
  let h='';
  h+=`<div class="hero"><div class="ring" style="--p:${pr.pct}"><i class="num">${pr.pct}%</i></div><div><p id="intro">${intro}</p><small class="num" id="prog">${pr.n} de ${pr.total} hechas · anuncios del día ${money(spend)}</small></div></div>`;
  if(!inMonth && d===TODAY) h+=`<p class="note">El plan cubre del 1 al 31 de octubre de 2026. Estás viendo el ${d===1?'primer':'último'} día.</p>`;

  if(evs.length){
    h+=`<section class="sec"><h2>Fechas importantes</h2><div class="group">`+evs.map(e=>{
      const cls=e.type==='Guardrail'?'warn':/Game/.test(e.type)?'game':'';
      const lbl=e.type==='Guardrail'?'Cuidado':/Game/.test(e.type)?'Juego':/Brasão/.test(e.type)?'Brasão':'Evento';
      return `<details class="ev"><summary><span class="badge ${cls}">${lbl}</span><span class="e-name">${esc(e.event)}</span></summary><p class="e-body"><b>Por qué importa:</b> ${esc(e.why)}</p><p class="e-body"><b>Qué hacer:</b> ${esc(e.play)}</p></details>`}).join('')+`</div></section>`;
  }

  /* ads */
  if(ads.length){
    const grp=(label,arr,cls,txt)=>arr.length?`<div class="group" style="margin-top:8px">${arr.map(a=>{const c=CAMPS[a.i];
      const k=`${d}:ad${a.i}:`+(cls==='on'?'on':cls==='off'?'off':'x');
      const row=`<details class="ad"><summary><span class="dot ${platCls(c.platform)}"></span><span class="a-name">${esc(c.name)}</span><span class="a-amt">${money(a.amt)}</span><span class="act ${cls}">${txt}</span></summary>${adDetails(c)}</details>`;
      return cls==='run'?row:`<div class="task" style="padding:0 0 0 14px;align-items:center">${chk(k)}<div style="flex:1;min-width:0">${row}</div></div>`}).join('')}</div>`:'';
    const on=ads.filter(a=>a.on), off=ads.filter(a=>a.off&&!a.on), both=ads.filter(a=>a.on&&a.off), run=ads.filter(a=>!a.on&&!a.off);
    h+=`<section class="sec"><h2>1 · Anuncios <span class="num">${money(spend)} hoy</span></h2>`;
    if(on.length) h+=`<p class="note">Enciende o programa estos anuncios hoy.</p>`+grp('on',on,'on','Encender');
    if(off.length) h+=`<p class="note" style="margin-top:6px">Último día. Apágalos al terminar el día.</p>`+grp('off',off,'off','Apagar');
    if(run.length) h+=`<details class="more" style="margin-top:10px"><summary>${run.length} siguen corriendo · no cambies nada</summary>${grp('run',run,'run','Activo')}</details>`;
    h+=`</section>`;
  }

  /* timeline */
  if(tasks.length){
    h+=`<section class="sec"><h2>2 · Publicaciones y email <span>${S.loc==='all'?'3 sucursales':LOCNAME[S.loc]}</span></h2>`;
    let lastB='', nextMarked=false, html='';
    tasks.forEach(t=>{
      const b=bucket(t.t); if(b!==lastB){ if(lastB) html+='</div>'; html+=`<p class="note" style="margin:8px 0 6px">${b}</p><div class="group">`; lastB=b }
      const isNext = d===TODAY && inMonth && !nextMarked && t.t>=NOWMIN && !done[t.id]; if(isNext) nextMarked=true;
      const nextChip = isNext?`<span class="chip next">Siguiente</span>`:'';
      if(t.kind==='feed'){
        const f=t.x, show=(S.loc==='all'||S.loc==='sa'), showD=(S.loc==='all'||S.loc==='plano'||S.loc==='irving');
        const where=whereFeed(f.platform).map(w=>`<span class="chip ${/Insta|Reels/.test(w)?'ig':/TikTok/.test(w)?'tt':/Face/.test(w)?'fb':''}">${w}</span>`).join('');
        const caps = (show?`<div class="cap"><h4><span>Texto · San Antonio</span><button class="copy" data-c="${clip(f.capSA)}">Copiar</button></h4><p>${esc(f.capSA)}</p></div>`:'')
                   + (showD?`<div class="cap"><h4><span>Texto · Plano + Irving</span><button class="copy" data-c="${clip(f.capDFW)}">Copiar</button></h4><p>${esc(f.capDFW)}</p></div>`:'');
        html+=`<div class="task feed ${done[t.id]?'done':''}" data-row="${t.id}">${chk(t.id)}<div class="t-body"><div class="t-top"><span class="time">${f.time}</span><span class="t-title t-main">${esc(f.theme||f.topic)}</span>${nextChip}</div>
          <div class="t-meta"><span class="chip">${fmtEs(f.format)}</span>${where}<span class="chip loc">${S.loc==='all'?'San Antonio · Plano · Irving':LOCNAME[S.loc]}</span></div>
          <p class="t-vis t-main"><b>Cómo grabarlo:</b> ${esc(f.visual)}</p>
          ${f.boost&&f.boost!=='—'?`<p class="t-vis"><b>Anuncio ligado:</b> ${esc(f.boost)}</p>`:''}
          <details class="more" open><summary>Textos y hashtags</summary>${caps}<p class="tags">${esc(f.tags)}</p></details></div></div>`;
      } else if(t.kind==='story'){
        const s=t.x, acc=accounts(tag(s.loc));
        html+=`<div class="task ${done[t.id]?'done':''}" data-row="${t.id}">${chk(t.id)}<div class="t-body"><div class="t-top"><span class="time">${s.time}</span><span class="t-title t-main">${esc(s.slot.replace('STORY','Story'))} · ${esc(s.topic)}</span>${nextChip}</div>
          <p class="t-text t-main">${esc(s.overlay)}</p><p class="t-vis t-main"><b>Foto o video:</b> ${esc(s.visual)}</p>
          <div class="t-meta"><span class="chip">${fmtEs(s.format)}</span><span class="chip ig">Instagram Story</span><span class="chip fb">también a Facebook</span><span class="chip loc">${acc.join(' · ')}</span></div></div></div>`;
      } else {
        const e=t.x, mm=e.body, id=clip(`${e.subject}\n\n${e.body}`);
        html+=`<div class="task ${done[t.id]?'done':''}" data-row="${t.id}">${chk(t.id)}<div class="t-body"><div class="t-top"><span class="time">${t12(t.t)}</span><span class="t-title t-main">Enviar email (Constant Contact)</span>${nextChip}</div>
          <p class="t-text t-main"><b>Asunto:</b> ${esc(e.subject)}</p><div class="t-meta"><span class="chip loc">${esc(e.send.split('|')[1]?.trim()||'Todas las sucursales')}</span></div>
          <details class="more"><summary>Ver contenido</summary><blockquote class="mail" style="margin:8px 0 0;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:14px;color:var(--fg2);white-space:pre-wrap;overflow-wrap:anywhere">${esc(mm)}</blockquote>
          ${e.warn?`<p class="warnline">⚠ ${esc(e.warn)}</p>`:''}<p style="margin-top:8px"><button class="copy" data-c="${id}">Copiar asunto y texto</button></p></details></div></div>`;
      }
    });
    h+=html+'</div></section>';
  }

  /* routine */
  const rt=routine(d);
  h+=`<section class="sec"><h2>3 · Rutina</h2><div class="group">`+rt.map(r=>`<div class="task ${done[r.id]?'done':''}" data-row="${r.id}">${chk(r.id)}<div class="t-body"><p class="t-title t-main" style="font-weight:500;font-size:15px">${esc(r.txt)}</p><div class="t-meta"><span class="chip">${esc(r.sub)}</span></div></div></div>`).join('')+`</div></section>`;
  if(dow(d)===1) h+=`<p class="note">Los umbrales verde, amarillo y rojo están en la pestaña Guía.</p>`;
  return h;
}

function renderSemana(){
  let h=`<section class="sec"><h2>Octubre 2026</h2><div class="group"><div class="cal">`+DOW3.map(x=>`<div class="dow">${x}</div>`).join('');
  for(let i=0;i<dow(1);i++) h+=`<div class="cell empty"></div>`;
  for(let d=1;d<=31;d++){
    const sp=D[d].ads.reduce((s,a)=>s+a.amt,0), star=D[d].events.some(e=>/★/.test(e.event)||/Game|Observance|Holiday|Brazilian|Cultural/.test(e.type)&&e.start===e.end);
    h+=`<button class="cell ${d===TODAY&&inMonth?'today':''} ${d===S.day?'sel':''}" data-go="${d}" aria-label="${dayLabel(d)}"><b>${d}</b><small>${money(sp)}</small>${star?'<span class="st">★</span>':''}</button>`;
  }
  h+=`</div></div><p class="note">★ día con fecha clave. Toca un día para ver qué hacer.</p></section>`;
  const from=S.day, to=Math.min(31,from+6);
  h+=`<section class="sec"><h2>Próximos días</h2><div class="group">`;
  for(let d=from;d<=to;d++){
    const day=D[d], ev=day.events.filter(e=>/★/.test(e.event)||e.start===e.end)[0]||day.events[0];
    const top = day.feed?(day.feed.theme||day.feed.topic):'Sin publicación';
    h+=`<button class="drow" data-go="${d}"><span class="d"><span>${DOW3[dow(d)]}</span><b>${d}</b></span><span class="x"><p>${esc(top)}</p><small>${day.feed?1:0} post · ${day.stories.length} stories${day.email?' · email':''} · ${money(day.ads.reduce((s,a)=>s+a.amt,0))} en anuncios</small></span></button>`;
  }
  return h+`</div></section>`;
}

function renderAds(){
  let REALH='';
  const total=CAMPS.reduce((s,c)=>s+c.amt.reduce((a,b)=>a+b,0),0);
  const upto=d=>CAMPS.reduce((s,c)=>s+c.amt.slice(0,d).reduce((a,b)=>a+b,0),0);
  const spent=upto(S.day), todaySp=visibleAds(S.day).reduce((s,a)=>s+a.amt,0);
  let h=`<div class="tiles"><div class="tile"><small>Plan del mes</small><b class="num">${money(total)}</b></div><div class="tile"><small>Plan al día ${S.day}</small><b class="num">${money(spent)}</b></div><div class="tile"><small>Hoy</small><b class="num">${money(todaySp)}</b></div></div>`;
  h+=`<p class="note">Los tres cuadros de arriba y las barras de abajo son del plan en Excel.</p>`;
  /* real spend */
  if(typeof ACTUALS!=='undefined' && ACTUALS.platforms){
    const th=ACTUALS.through||S.day;
    const real=ACTUALS.platforms.reduce((s,p)=>s+(p.spent||0),0);
    const plan=CAMPS.filter(c=>!/Google/.test(c.platform)).reduce((s,c)=>s+c.amt.slice(0,th).reduce((a,b)=>a+b,0),0);
    const diff=real-plan;
    const bud=(typeof BUDGET!=='undefined'&&BUDGET.monthly)||18000, com=(typeof BUDGET!=='undefined'&&BUDGET.committed)||0, left=bud-real-com, dl=Math.max(1,31-th), pace=real/th*31, pct=Math.min(100,Math.round(100*(real+com)/bud));
    REALH=`<section class="sec"><h2>Gasto real <span>actualizado ${esc(ACTUALS.updated)}</span></h2><div class="tiles"><div class="tile"><small>Gastado</small><b class="num">${money(real)}</b></div><div class="tile"><small>Presupuesto del mes (con Google)</small><b class="num">${money(bud)}</b></div><div class="tile"><small>${left>=0?'Libre':'Te pasaste'}</small><b class="num" style="color:var(--${left>=0?'ok':'bad'})">${money(Math.abs(left))}</b></div></div><div class="group" style="margin-top:8px"><div class="pbar"><div class="row"><span>${pct}% del presupuesto (gastado + comprometido), día ${th} de 31</span><span class="num">+ ${money(com)} comprometido</span></div><div class="track"><i style="width:${pct}%"></i></div><p class="note" style="padding:8px 0 0">Ya comprometido hasta el 31: ${money(com)} (${esc((BUDGET&&BUDGET.committedNote)||'')}). ${left>=0?'Libre para todo lo demás: '+money(left)+' (unos '+money(left/dl)+' al día, '+dl+' días)':'Te pasarías por '+money(-left)}. Plan original del Excel al día ${th}: ${money(plan)}.</p></div></div><div class="group" style="margin-top:8px">`+ACTUALS.platforms.map(p=>`<details class="item"><summary><span>${esc(p.name)}</span><span class="num" style="font-weight:700">${p.spent==null?'—':money(p.spent)}</span></summary>${p.note?`<p>${esc(p.note)}</p>`:''}${(p.campaigns||[]).map(c=>`<p style="display:flex;justify-content:space-between;gap:12px"><span style="min-width:0;overflow-wrap:anywhere">${esc(c.name)}</span><b class="num" style="color:var(--fg)">${money(c.spent)}</b></p>`).join('')}</details>`).join('')+`</div><p class="note">Gasto desde el 1 de octubre en Meta Ads Manager y TikTok. Las campañas reales no son las mismas que las del plan de abajo.</p></section>`;
  }
  /* by platform */
  const by={}; CAMPS.forEach(c=>{ const k=c.platform; by[k]=by[k]||{t:0,s:0}; const t=c.amt.reduce((a,b)=>a+b,0); by[k].t+=t; by[k].s+=c.amt.slice(0,S.day).reduce((a,b)=>a+b,0) });
  h+=`<section class="sec"><h2>Plan por plataforma</h2><div class="group">`+Object.keys(by).map(k=>`<div class="pbar"><div class="row"><span>${platName(k)}${/Facebook|^FB/.test(platName(k))||/^FB/.test(k)?' · '+k.replace('FB ',''):''}</span><span class="num">${money(by[k].s)} de ${money(by[k].t)}</span></div><div class="track"><i style="width:${by[k].t?Math.round(100*by[k].s/by[k].t):0}%"></i></div></div>`).join('')+`</div></section>`;
  const plats=['all','Instagram','TikTok','Facebook','Google'];
  h+=`<section class="sec"><h2>Campañas del plan</h2><div class="fchips">`+plats.map(p=>`<button data-plat="${p}" aria-pressed="${S.plat===p}">${p==='all'?'Todas':p}</button>`).join('')+`</div><div class="group">`;
  const list=CAMPS.map((c,i)=>({c,i})).filter(({c})=>tagOK(campTag(c))&&(S.plat==='all'||(S.plat==='Facebook'?/^FB|Remarketing/.test(c.platform):S.plat==='Google'?/Google/.test(c.platform):c.platform===S.plat)));
  if(!list.length) h+=`<div class="empty-s">No hay campañas para este filtro.</div>`;
  list.forEach(({c})=>{
    const a=c.amt, d=S.day, first=a.findIndex(x=>x>0)+1, last=a.length-[...a].reverse().findIndex(x=>x>0);
    const st = a[d-1]>0?`<span class="act on">Hoy ${money(a[d-1])}</span>`: d<first?`<span class="act run">Inicia el ${first}</span>`: d>last?`<span class="act off">Terminó</span>`:`<span class="act run">Pausa hoy</span>`;
    h+=`<details class="ad"><summary><span class="dot ${platCls(c.platform)}"></span><span class="a-name">${esc(c.name)}</span>${st}</summary>${adDetails(c)}<div class="strip" aria-hidden="true">${a.map((x,i)=>`<i class="${x?'a':''} ${i+1===d?'t':''}"></i>`).join('')}</div><p class="note" style="padding:4px 0 0">Días activos en octubre. Contorno = día seleccionado.</p></details>`;
  });
  return REALH+h+`</div></section>`;
}

function renderGuia(){
  let h=`<section class="sec"><h2>Antes de publicar</h2><div class="group">`+DATA.guard.map(g=>`<details class="item"><summary>${esc(g[0])}</summary><p>${esc(g[1])}</p></details>`).join('')+`</div></section>`;
  h+=`<section class="sec"><h2>Alertas de rendimiento <span>revisa cada lunes</span></h2><div class="group scroll-x"><table class="thr"><thead><tr><th>Dónde</th><th>Métrica</th><th>Bien</th><th>Vigila</th><th>Pausa</th></tr></thead><tbody>`+DATA.thr.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="g">${esc(r[2])}</td><td class="y">${esc(r[3])}</td><td class="r">${esc(r[4])}</td></tr>`).join('')+`</tbody></table></div><p class="note">Si está en rojo: ${''}abre la fila en el Excel (columna Action if red).</p></section>`;
  h+=`<section class="sec"><h2>Metas de octubre</h2><div class="group">`+DATA.score.map(s=>`<details class="item"><summary>${esc(s[0])}</summary><p><b>Meta:</b> ${esc(s[2])}<br><b>Responsable:</b> ${esc(s[3])} · ${esc(s[4])}</p></details>`).join('')+`</div></section>`;
  h+=`<section class="sec"><h2>10 movimientos del mes</h2><div class="group">`+DATA.moves.map(m=>`<details class="item"><summary>${esc(m[0])}</summary><p>${esc(m[1])}</p></details>`).join('')+`</div></section>`;
  h+=`<section class="sec"><h2>Hábitos de septiembre</h2><div class="group">`+DATA.fixes.map(m=>`<details class="item"><summary>${esc(m[0])}</summary><p>${esc(m[1])}</p></details>`).join('')+`</div></section>`;
  return h;
}

/* ---------- shell ---------- */
const ICONS={
  hoy:'<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="9"/><path d="M13 8v5l3.5 2"/></svg>',
  semana:'<svg viewBox="0 0 26 26"><rect x="4" y="5.5" width="18" height="16" rx="3"/><path d="M4 11h18M9 3.5v4M17 3.5v4"/></svg>',
  ads:'<svg viewBox="0 0 26 26"><path d="M4 20V13M10 20V7M16 20v-9M22 20V4"/></svg>',
  guia:'<svg viewBox="0 0 26 26"><path d="M5 5.5A2.5 2.5 0 0 1 7.500 3H21v17H7.500A2.500 2.500 0 0 0 5 22.500z"/><path d="M5 5.500V22.500M10 8h7"/></svg>'};
const TABS=[['hoy','Hoy'],['semana','Semana'],['ads','Anuncios'],['guia','Guía']];
function renderBar(){
  let h='';
  if(S.tab==='hoy'){
    h+=`<div class="title-row"><div><h1 class="large">${S.day===TODAY&&inMonth?'Hoy':cap1(DOW[dow(S.day)])}</h1><p class="sub">${cap1(dayLabel(S.day))}</p></div>
      <div class="daynav"><button class="circ" data-step="-1" aria-label="Día anterior" ${S.day<=1?'disabled':''}>‹</button>${S.day!==TODAY?'<button class="pill-btn" data-today="1">Hoy</button>':''}<button class="circ" data-step="1" aria-label="Día siguiente" ${S.day>=31?'disabled':''}>›</button></div></div>`;
  } else {
    const t={semana:['Semana','Elige un día del mes'],ads:['Anuncios',`Plan del día ${S.day} de octubre`],guia:['Guía','Reglas, alertas y metas']}[S.tab];
    h+=`<div class="title-row"><div><h1 class="large">${t[0]}</h1><p class="sub">${t[1]}</p></div></div>`;
  }
  if(S.tab==='hoy'||S.tab==='ads') h+=`<div class="seg" role="group" aria-label="Sucursal">`+LOCS.map(l=>`<button data-loc="${l[0]}" aria-pressed="${S.loc===l[0]}">${l[1]}</button>`).join('')+`</div>`;
  $('#barin').innerHTML=h;
}
function render(){
  CLIPS=[]; renderBar();
  $('#view').innerHTML = S.tab==='hoy'?renderHoy():S.tab==='semana'?renderSemana():S.tab==='ads'?renderAds():renderGuia();
  $('#tabs').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" ${S.tab===t[0]?'aria-current="page"':''}>${ICONS[t[0]]}<span>${t[1]}</span></button>`).join('');
  document.title='Plan Diario Brasão';
}
function updateProgress(){
  const pr=progress(S.day), r=document.querySelector('.ring'); if(!r) return;
  r.style.setProperty('--p',pr.pct); r.firstElementChild.textContent=pr.pct+'%';
  const sp=visibleAds(S.day).reduce((s,a)=>s+a.amt,0); $('#prog').textContent=`${pr.n} de ${pr.total} hechas · anuncios del día ${money(sp)}`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.k){ const k=b.dataset.k; done[k]=!done[k]; if(!done[k]) delete done[k]; saveDone();
    b.setAttribute('aria-pressed',!!done[k]); const row=b.closest('[data-row]'); if(row) row.classList.toggle('done',!!done[k]); updateProgress(); return }
  if(b.dataset.c!==undefined){ copyText(CLIPS[+b.dataset.c]); return }
  if(b.dataset.tab){ S.tab=b.dataset.tab; render(); scrollTo(0,0); return }
  if(b.dataset.loc){ S.loc=b.dataset.loc; store.set('loc',S.loc); const y=scrollY; render(); scrollTo(0,y); return }
  if(b.dataset.step){ S.day=Math.min(31,Math.max(1,S.day+ +b.dataset.step)); render(); scrollTo(0,0); return }
  if(b.dataset.today){ S.day=TODAY; render(); scrollTo(0,0); return }
  if(b.dataset.go){ S.day=+b.dataset.go; S.tab='hoy'; render(); scrollTo(0,0); return }
  if(b.dataset.plat){ S.plat=b.dataset.plat; const y=scrollY; render(); scrollTo(0,y); return }
});
addEventListener('scroll',()=>$('#bar').classList.toggle('scrolled',scrollY>8),{passive:true});
render();

</script>
