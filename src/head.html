<title>Elvis Barrera Agency · Brasão</title>
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=1">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brasão Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060a13">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Elvis Barrera Agency: deep navy + sapphire + champagne gold. Light/dark switch. */
:root,:root[data-theme="dark"]{
  --bg:#060a13; --surface:#0e1524; --surface2:#151f33; --fg:#edf1f8; --fg2:#9aa6bc; --fg3:#68758d; --line:#1f2a40; --accent:#5b93ff; --accent-soft:#132449; --on-accent:#ffffff; --gold:#e2c07a; --ok:#3ed38b; --ok-soft:#0f2e21; --warn:#ffb547; --warn-soft:#33250b; --bad:#ff6b6b; --bad-soft:#3a1519; --ig:#ff6aa8; --tt:#edf1f8; --fb:#6aa1ff; --go:#3ed38b; --bar:rgba(6,10,19,.78); --glow:rgba(91,147,255,.16); color-scheme:dark;
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#eef1f6; --fg:#0b1426; --fg2:#53607a; --fg3:#8a96ab; --line:#e1e6ef; --accent:#1d5be6; --accent-soft:#e8efff; --on-accent:#ffffff; --gold:#b08a3e; --ok:#14804a; --ok-soft:#e1f4e9; --warn:#a85b00; --warn-soft:#fff0db; --bad:#c62a2f; --bad-soft:#fde6e6; --ig:#c2307f; --tt:#0b1426; --fb:#1d5be6; --go:#14804a; --bar:rgba(242,244,248,.8); --glow:rgba(29,91,230,.10); color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.wrap{max-width:660px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}


/* masthead */
body{background:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 60%) no-repeat,var(--bg)}
.brand{max-width:660px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 0 10px;display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;flex:none;filter:drop-shadow(0 6px 16px rgba(37,70,216,.35))}
.brand-t{min-width:0;flex:1}
.brand-t b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.brand-t .sub2{display:block;margin-top:3px;font-size:13px;font-weight:500;color:var(--fg2)}
.brand-t .sub2 em{font-style:normal;font-weight:600;color:var(--fg)}
.sw{flex:none;position:relative;width:62px;height:32px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:var(--fg3)}
.sw svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;position:relative;z-index:1}
.sw .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.3,.7,.4,1)}
:root[data-theme="light"] .sw .knob{transform:translateX(30px)}
.sw .moon{color:var(--accent)} :root[data-theme="light"] .sw .moon{color:var(--fg3)}
:root[data-theme="light"] .sw .sun{color:var(--gold)}
@media (max-width:370px){.brand-t b{font-size:19px}.logo{width:46px;height:46px}}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--line)}
.bar-in{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.large{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.08;letter-spacing:-.025em;text-wrap:balance}
.sub{color:var(--fg2);font-size:14px;margin-top:3px}
.daynav{display:flex;gap:6px;align-items:center;flex:none}
.circ{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.circ:disabled{opacity:.35;cursor:default}
.pill-btn{height:36px;padding:0 14px;border-radius:18px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(118,118,128,.14);border-radius:9px;padding:2px;gap:2px}
.seg button{height:32px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}

main{padding-top:14px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h2{font-size:13px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;color:var(--fg2);padding:0 16px;display:flex;justify-content:space-between;gap:8px}
.sec>h2 span{letter-spacing:0;text-transform:none;font-weight:500;color:var(--fg3)}
.group{background:var(--surface);border-radius:12px;overflow:hidden}
.group>*+*{border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--fg2);padding:0 6px}

/* summary */
.hero{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border-radius:12px}
.ring{--p:0;width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring i{font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:600;font-size:13px}
.hero p{font-size:16px;line-height:1.4}
.hero b{font-weight:700}
.hero small{display:block;color:var(--fg2);font-size:13px;margin-top:4px}


/* now card */
.now{background:var(--surface);border-radius:16px;padding:14px 14px 10px;position:relative;box-shadow:0 0 0 1.5px var(--accent),0 10px 30px var(--glow)}
.now-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--fg2);font-weight:600}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 var(--bad);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,80,80,.55)}70%{box-shadow:0 0 0 8px rgba(255,80,80,0)}100%{box-shadow:0 0 0 0 rgba(255,80,80,0)}}
.now-lead{margin:10px 0 4px;font-size:16px;font-weight:500}
.now-i{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.now-i+.now-i{border-top:1px solid var(--line)}
.now-i.done .now-b{opacity:.45}
.now-b{flex:1;min-width:0}
.now-top{display:flex;gap:8px;align-items:center}
.late{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--bad-soft);color:var(--bad)}
.now-t{font-weight:700;font-size:17px;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.now-w{font-size:13px;color:var(--fg2);margin-top:3px;overflow-wrap:anywhere}
.now-more{font-size:13px;color:var(--fg2);padding:2px 0 6px}
.now-next{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.now-next small{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}
.now-ads{margin-top:8px;width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;text-align:left}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}

/* tasks */
.task{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.task.done .t-main{opacity:.45}
.task.done .t-title{text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg3);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.t-body{flex:1;min-width:0}
.t-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.time{font-weight:700;font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums}
.t-title{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--fg2);border:1px solid var(--line);white-space:nowrap}
.chip.loc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ig{color:var(--ig)} .chip.tt{color:var(--tt)} .chip.fb{color:var(--fb)} .chip.go{color:var(--go)}
.chip.next{background:var(--accent);color:var(--on-accent);border-color:transparent}
.t-text{margin-top:6px;font-size:15px;color:var(--fg);overflow-wrap:anywhere}
.t-vis{margin-top:4px;font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.t-vis b{color:var(--fg);font-weight:600}
.feed{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)) ,var(--surface)}
.feed .t-title{font-size:17px}
details.more{margin-top:8px}
details.more>summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;gap:4px;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"›";transform:rotate(90deg);display:inline-block;transition:transform .15s}
details.more[open]>summary::after{transform:rotate(-90deg)}
.cap{margin-top:8px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.cap h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.cap p{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{font-size:13px;font-weight:600;color:var(--accent);padding:4px 10px;border-radius:14px;background:var(--accent-soft);text-transform:none;letter-spacing:0}
.tags{font-size:13px;color:var(--fg2);margin-top:8px;overflow-wrap:anywhere}

/* events */
.ev{padding:12px 14px}
.ev summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.ev summary::-webkit-details-marker{display:none}
.badge{flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:2px;background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.game{background:var(--ok-soft);color:var(--ok)}
.ev .e-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ev .e-body{margin:8px 0 0 0;font-size:14px;color:var(--fg2)}
.ev .e-body b{color:var(--fg)}

/* ads */
.ad{padding:12px 14px}
.ad summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center}
.ad summary::-webkit-details-marker{display:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--fg3)}
.dot.ig{background:var(--ig)} .dot.tt{background:var(--tt)} .dot.fb{background:var(--fb)} .dot.go{background:var(--go)}
.ad .a-name{flex:1;min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.ad .a-amt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.act{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
.act.on{background:var(--ok-soft);color:var(--ok)}
.act.off{background:var(--bad-soft);color:var(--bad)}
.act.run{background:var(--surface2);color:var(--fg2)}
.dl{margin:10px 0 0;display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:14px}
.dl dt{color:var(--fg2)} .dl dd{margin:0;overflow-wrap:anywhere}
.strip{display:grid;grid-template-columns:repeat(31,1fr);gap:2px;margin-top:10px;height:22px;align-items:end}
.strip i{display:block;background:var(--line);border-radius:2px;height:5px}
.strip i.a{background:var(--accent);height:100%}
.strip i.t{outline:2px solid var(--fg);outline-offset:1px}

/* email */
.mail{padding:12px 14px}
.mail blockquote{margin:8px 0 0;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:14px;color:var(--fg2);white-space:pre-wrap;overflow-wrap:anywhere}
.warnline{margin-top:8px;font-size:13px;color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:10px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px}
.cal .dow{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);text-align:center;padding-bottom:4px}
.cell{aspect-ratio:1/1.08;border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;min-width:0}
.cell.empty{background:none}
.cell b{font-size:16px;font-variant-numeric:tabular-nums}
.cell small{font-size:10px;color:var(--fg3);font-variant-numeric:tabular-nums}
.cell.today{outline:2px solid var(--accent)}
.cell.sel{background:var(--accent);color:var(--on-accent)}
.cell.sel small{color:var(--on-accent);opacity:.85}
.cell .st{position:absolute;top:4px;right:6px;font-size:10px;color:var(--accent)}
.cell.sel .st{color:var(--on-accent)}
.drow{display:flex;gap:12px;padding:12px 14px;align-items:center;width:100%;text-align:left}
.drow .d{width:44px;flex:none;text-align:center;line-height:1.1}
.drow .d b{display:block;font-size:18px;font-weight:600}
.drow .d span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg2)}
.drow .x{flex:1;min-width:0}
.drow .x p{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.drow .x small{color:var(--fg2);font-size:13px}

/* tiles / bars */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:12px;padding:12px}
.tile small{display:block;color:var(--fg2);font-size:12px}
.tile b{display:block;margin-top:2px;font-size:18px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pbar{padding:12px 14px}
.pbar .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.pbar .row span:last-child{font-variant-numeric:tabular-nums;color:var(--fg2);font-weight:500}
.track{height:6px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--fg2)}
.fchips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* guide */
.item{padding:12px 14px}
.item summary{list-style:none;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"›";color:var(--fg3);transform:rotate(90deg);flex:none;transition:transform .15s}
.item[open] summary::after{transform:rotate(-90deg)}
.item p{margin-top:8px;font-size:14px;color:var(--fg2);overflow-wrap:anywhere}
.scroll-x{overflow-x:auto}
table.thr{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
table.thr th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg2);padding:8px 10px;border-bottom:1px solid var(--line)}
table.thr td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.g{color:var(--ok);font-weight:600} td.y{color:var(--warn);font-weight:600} td.r{color:var(--bad);font-weight:600}
.empty-s{padding:18px;text-align:center;color:var(--fg2);font-size:14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--fg3);min-width:0}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:400px){.large{font-size:28px}.seg button{font-size:12px}.dl{grid-template-columns:80px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lnk{margin:8px 0 2px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--line)}
.lnk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lnk-h b{font-size:15px;color:var(--fg);flex:1;min-width:0}
.chip.lk{background:var(--accent);color:var(--on-accent);border-color:transparent}
.lnk-u{margin:6px 0 0;font-size:12.5px;color:var(--fg2);overflow-wrap:anywhere}
.lnk-w{margin:4px 0 0;font-size:13px;color:var(--fg2)}
.lnk-no{color:var(--fg2)}
.mseg{max-width:660px;margin:0 auto 4px;grid-template-columns:repeat(2,1fr)}
.mseg button{height:36px;font-size:14px}

:root{--c-cur:#1d5be6;--c-prev:#b08a3e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-cur:#4a80ee;--c-prev:#ae863b}}
:root[data-theme="dark"]{--c-cur:#4a80ee;--c-prev:#ae863b}
.chg{font-weight:600;font-size:12px;white-space:nowrap}.chg.up,.pbar .row .chg.up{color:var(--ok)}.chg.down,.pbar .row .chg.down{color:var(--bad)}.chg.flat,.pbar .row .chg.flat{color:var(--fg3)}
.tile small.num{margin-top:4px;font-size:11px}
.chartbox{position:relative;padding:10px 10px 6px}
.chart svg{display:block;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--fg3);font-size:11px;font-variant-numeric:tabular-nums}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
